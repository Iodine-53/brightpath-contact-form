<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get a quote — Brightpath Home Services</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: #f4f6f8; color: #1a1d21; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 8px 30px rgba(16,24,40,.10);
          padding: 36px 40px; width: 100%; max-width: 520px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.2px; }
  .sub { color: #5b6470; font-size: 14px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: #344054; }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #d0d5dd;
      border-radius: 8px; font-size: 15px; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #1570ef55; border-color: #1570ef; }
  textarea { min-height: 96px; resize: vertical; }
  button { margin-top: 20px; width: 100%; padding: 13px; border: 0; border-radius: 8px;
      background: #1570ef; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:hover { background: #0f5fd0; }
  button:disabled { background: #9db9e3; cursor: default; }
  .hp { position: absolute; left: -9999px; top: -9999px; height: 1px; width: 1px; }
  .err { display: none; color: #b42318; font-size: 13px; margin-top: 10px; }
  #success { display: none; }
  #success h2 { font-size: 20px; margin: 0 0 6px; }
  #success p { color: #5b6470; font-size: 14px; margin: 0 0 16px; }
  .email-preview { border: 1px dashed #98a2b3; border-radius: 10px; background: #f9fafb;
      padding: 16px 18px; font-size: 14px; }
  .email-preview .tag { display: inline-block; font-size: 11px; font-weight: 700;
      letter-spacing: .6px; color: #6941c6; background: #ebe9fe; border-radius: 20px;
      padding: 3px 10px; margin-bottom: 10px; }
  .email-preview .subject { font-weight: 700; margin-bottom: 8px; }
  .email-preview .body { color: #344054; line-height: 1.55; white-space: pre-wrap; }
  .email-preview .meta { margin-top: 10px; font-size: 12px; color: #98a2b3; }
</style>
</head>
<body>
<div class="card">
  <div id="formWrap">
    <h1>Get a quote</h1>
    <p class="sub">Tell us what you need — we reply within one business day.</p>
    <form id="leadForm" autocomplete="on">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required maxlength="80" placeholder="Adaeze Okafor">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required maxlength="120" placeholder="you@example.com">
      <label for="service">Service</label>
      <select id="service" name="service">
        <option>General</option><option>Automation</option>
        <option>Dashboard</option><option>Other</option>
      </select>
      <label for="message">Message</label>
      <textarea id="message" name="message" required maxlength="2000" placeholder="What do you need help with?"></textarea>
      <input class="hp" id="company" name="company" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" id="submitBtn">Send message</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <div id="success">
    <h2>Thanks — message received.</h2>
    <p>An auto-reply is on its way to your inbox.</p>
    <div class="email-preview">
      <div class="tag">AUTO-REPLY — SENDING NOW</div>
      <div class="subject" id="pvSubject"></div>
      <div class="body" id="pvBody"></div>
      <div class="meta" id="pvMeta"></div>
    </div>
  </div>
</div>
<script>
const WEBHOOK = "/api/submit";
const form = document.getElementById("leadForm");
const err = document.getElementById("err");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.style.display = "none";
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Sending…";
  const payload = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    service: document.getElementById("service").value,
    message: document.getElementById("message").value,
    company: document.getElementById("company").value
  };
  try {
    const res = await fetch(WEBHOOK, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || "Request failed");
    document.getElementById("formWrap").style.display = "none";
    const s = document.getElementById("success");
    s.style.display = "block";
    document.getElementById("pvSubject").textContent = "Subject: " + data.reply.subject;
    document.getElementById("pvBody").textContent = data.reply.body;
    document.getElementById("pvMeta").textContent =
      "To: " + data.reply.to + " · Status: queued — n8n sends it in seconds";
  } catch (ex) {
    err.textContent = "Something went wrong — please try again.";
    err.style.display = "block";
    btn.disabled = false; btn.textContent = "Send message";
  }
});
</script>
</body>
</html>
